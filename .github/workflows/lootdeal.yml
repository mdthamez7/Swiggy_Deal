name: LootDeal Scanner

on:
  workflow_dispatch:
  schedule:
    - cron: '*/20 * * * *'

concurrency:
  group: lootdeal-scan
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 19
    env:
      SWIGGY_IM_MCP_URL: ${{ vars.SWIGGY_IM_MCP_URL }}
      SWIGGY_ACCESS_TOKEN: ${{ secrets.SWIGGY_ACCESS_TOKEN }}
      SWIGGY_ADDRESS_MAP_JSON: ${{ secrets.SWIGGY_ADDRESS_MAP_JSON }}
      TARGET_LOCATIONS_JSON: ${{ vars.TARGET_LOCATIONS_JSON }}
      CATEGORY_QUERIES_JSON: ${{ vars.CATEGORY_QUERIES_JSON }}
      MAX_LOCATION_WORKERS: ${{ vars.MAX_LOCATION_WORKERS }}
      MAX_CATEGORY_WORKERS: ${{ vars.MAX_CATEGORY_WORKERS }}
      MAX_PAGES_PER_CATEGORY: ${{ vars.MAX_PAGES_PER_CATEGORY }}
      REQUEST_DELAY_SECONDS: ${{ vars.REQUEST_DELAY_SECONDS }}
      HISTORY_LOOKBACK_DAYS: ${{ vars.HISTORY_LOOKBACK_DAYS }}
      MIN_HISTORY_OBSERVATIONS: ${{ vars.MIN_HISTORY_OBSERVATIONS }}
      PREVIOUS_LOW_DROP: ${{ vars.PREVIOUS_LOW_DROP }}
      STABLE_MRP_MIN_DROP: ${{ vars.STABLE_MRP_MIN_DROP }}
      MRP_STABLE_TOLERANCE: ${{ vars.MRP_STABLE_TOLERANCE }}
      ALERT_COOLDOWN_HOURS: ${{ vars.ALERT_COOLDOWN_HOURS }}
      SMTP_HOST: ${{ vars.SMTP_HOST }}
      SMTP_PORT: ${{ vars.SMTP_PORT }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      ALERT_TO: ${{ vars.ALERT_TO }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Restore price history cache
        uses: actions/cache/restore@v4
        with:
          path: data/price_history.db
          key: lootdeal-price-history-${{ github.run_id }}
          restore-keys: |
            lootdeal-price-history-

      - name: Validate configuration
        run: python -m diagnostics.validate_github

      - name: Run LootDeal scanner
        run: python run_scanner.py

      - name: Save price history cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/price_history.db
          key: lootdeal-price-history-${{ github.run_id }}
